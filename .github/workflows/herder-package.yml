name: Herder Package

on:
  push:
    tags:
      - herder-v*
  workflow_dispatch:

concurrency:
  group: herder-package
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build macOS app
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.update.outputs.build }}
      minimum: ${{ steps.update.outputs.minimum }}
      signature: ${{ steps.update.outputs.signature }}
      length: ${{ steps.update.outputs.length }}
    env:
      CODESIGN_IDENTITY: "Developer ID Application: KURT SCHWARZ (P9DZH3LW75)"
      DMG_PATH: apps/herder/build/Herder.dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#herder-v}"
          printf 'Version: %s\n' "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Install tools
        run: brew install just xcodegen

      - name: Show toolchain versions
        run: |
          swift --version
          zig version
          rustup show active-toolchain

      - name: Run tests
        timeout-minutes: 25
        run: just test apps/herder

      - name: Import Developer ID certificate
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/herder-signing.keychain-db
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          : "${MACOS_CERTIFICATE:?MACOS_CERTIFICATE secret is required}"
          : "${MACOS_CERTIFICATE_PASSWORD:?MACOS_CERTIFICATE_PASSWORD secret is required}"

          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$certificate_path" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -t cert \
            -f pkcs12 \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s \
            "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          identities="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          printf '%s\n' "$identities"

          # find-identity exits 0 even when it finds nothing, so assert instead.
          if ! printf '%s' "$identities" | grep -q 'Developer ID Application'; then
            printf 'No Developer ID Application identity in the signing keychain\n' >&2
            exit 1
          fi

          rm -f "$certificate_path"

      - name: Build signed DMG
        timeout-minutes: 20
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: just in apps/herder package

      - name: Notarize DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          : "${APPLE_API_KEY_ID:?APPLE_API_KEY_ID secret is required}"
          : "${APPLE_API_ISSUER_ID:?APPLE_API_ISSUER_ID secret is required}"
          : "${APPLE_API_KEY:?APPLE_API_KEY secret is required}"

          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" | base64 --decode > "$api_key_path"

          xcrun notarytool submit "$DMG_PATH" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

          rm -f "$api_key_path"

      - name: Staple notarization ticket
        run: |
          # Stapling fetches the ticket from Apple's CloudKit, which drops connections intermittently.
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "$DMG_PATH" && xcrun stapler validate "$DMG_PATH"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Stapling failed after $attempt attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done

          # A disk image is assessed as "open", not "execute".
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=2 \
            "$DMG_PATH"

      # After stapling, which changes the DMG. The signature is what installed
      # copies check before installing it, and it is not a secret: the publish
      # job puts it in the appcast.
      - name: Sign DMG for Sparkle
        id: update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          : "${SPARKLE_PRIVATE_KEY:?SPARKLE_PRIVATE_KEY secret is required}"

          # The tools that come with the Sparkle the app was built against.
          sign_update=apps/herder/build/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update
          info=apps/herder/build/Herder.app/Contents/Info.plist

          signature="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sign_update" --ed-key-file - -p "$DMG_PATH")"
          {
            printf 'build=%s\n' "$(plutil -extract CFBundleVersion raw "$info")"
            printf 'minimum=%s\n' "$(plutil -extract LSMinimumSystemVersion raw "$info")"
            printf 'signature=%s\n' "$signature"
            printf 'length=%s\n' "$(stat -f %z "$DMG_PATH")"
          } >> "$GITHUB_OUTPUT"

      - name: Upload DMG
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Herder-${{ github.sha }}
          path: apps/herder/build/Herder.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/herder-signing.keychain-db
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Only this job gets a write token, so it never holds the signing secrets.
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download DMG
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: Herder-${{ github.sha }}
          path: dist

      # Installed copies read the appcast on the latest release, which this one
      # becomes once it is published.
      - name: Write appcast
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD: ${{ needs.build.outputs.build }}
          MINIMUM: ${{ needs.build.outputs.minimum }}
          SIGNATURE: ${{ needs.build.outputs.signature }}
          LENGTH: ${{ needs.build.outputs.length }}
        run: |
          export URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Herder.dmg"
          export LINK="https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          # What release-please wrote, read while only a token with write access can see the draft.
          NOTES="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          export NOTES

          apps/herder/scripts/appcast.sh > dist/appcast.xml
          cat dist/appcast.xml

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/Herder.dmg dist/appcast.xml \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          # Publishing seals the release: immutable releases reject later uploads,
          # so the DMG and appcast have to be attached while the release is still a draft.
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
