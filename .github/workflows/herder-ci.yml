name: Herder CI

on:
  pull_request:
    paths: &paths
      - apps/herder/**
      - packages/herder-ghostty-vt/**
      - packages/herder-syntax-highlighter/**
      - packages/herderd/**
      - justfile
      - .github/workflows/herder-ci.yml
  # Caches are scoped to the ref that saved them, and only main's are visible to
  # pull requests and release tags. Without a run here every run starts cold.
  push:
    branches:
      - main
    paths: *paths

concurrency:
  group: herder-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  herderd:
    name: Test herderd
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/herderd -> target
          shared-key: herderd-check
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        run: brew install just

      - name: Run just test
        run: just test packages/herderd

  # Both compile all of HerderKit, and not into the same DerivedData, so running
  # them side by side rather than one after the other halves the wait.
  herder:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      # A broken build says something a failing test does not, so see both.
      fail-fast: false
      matrix:
        include:
          - name: Test macOS app
            task: test
            timeout: 25
            # ripgrep runs the boundary check. The tests never generate the project.
            tools: just ripgrep
          - name: Build macOS app
            task: build
            timeout: 15
            # xcodegen generates the project the build compiles.
            tools: just xcodegen
    env:
      ZIG_VERSION: 0.17.0

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Zig's own cache is only used when libghostty-vt misses below, and saving
      # it costs ~180 MB of cache quota per run.
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      # Building libghostty-vt is ~5 minutes, and the recipe skips it when the
      # stamp on disk names the pinned commit.
      - name: Cache libghostty-vt
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/herder-ghostty-vt/target/GhosttyVt.xcframework
            packages/herder-ghostty-vt/target/built-commit
          key: ghostty-vt-${{ runner.os }}-${{ runner.arch }}-zig-${{ env.ZIG_VERSION }}-${{ hashFiles('packages/herder-ghostty-vt/GHOSTTY_COMMIT', 'packages/herder-ghostty-vt/justfile') }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/herder-syntax-highlighter -> target
          # Otherwise the key names the job, and Herder Package's job is another.
          shared-key: herder-syntax-highlighter
          # Only main's cache is visible to other refs.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # One cache per task: both would save under the same key otherwise, and
      # the second to finish would find it taken.
      - name: Cache herderd build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/herderd -> target
          shared-key: herderd-${{ matrix.task }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        run: brew install ${{ matrix.tools }}

      - name: Show toolchain versions
        id: toolchain
        run: |
          swift --version
          zig version
          rustup show active-toolchain
          printf 'xcode=%s\n' "$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"

      # Otherwise every run clones Sparkle and downloads its framework again.
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: swift-packages-${{ runner.os }}-${{ hashFiles('apps/herder/HerderKit/Package.resolved') }}

      # Xcode 26's compilation cache is keyed by each compilation's inputs, not
      # by file times, so it survives a fresh checkout where DerivedData would
      # not. Its keys hold absolute paths, which are the same on every runner.
      # Each run adds to the store it restored, and main saves the result under
      # its own commit. A new Xcode starts the store over.
      - name: Restore compilation cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/CompilationCache
          key: xcode-cas-${{ matrix.task }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ github.sha }}
          restore-keys: xcode-cas-${{ matrix.task }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-

      - name: Check import boundaries
        if: matrix.task == 'test'
        run: just in apps/herder check

      # Twelve xctest workers on a 3-vCPU runner starve the tests that spawn
      # processes or poll against a deadline, so cap them in CI only.
      - name: Run just ${{ matrix.task }}
        timeout-minutes: ${{ matrix.timeout }}
        run: >-
          just ${{ matrix.task }} apps/herder
          -clonedSourcePackagesDirPath '${{ runner.temp }}/SourcePackages'
          COMPILATION_CACHE_ENABLE_CACHING=YES
          COMPILATION_CACHE_CAS_PATH='${{ runner.temp }}/CompilationCache'
          ${{ matrix.task == 'test' && format('-maximum-parallel-testing-workers 2 -resultBundlePath ''{0}/TestResults.xcresult''', runner.temp) || '' }}

      # Swift Testing's failure messages only go into the result bundle, so
      # print them here and nobody has to download it for the common case.
      - name: Show test failures
        if: failure() && matrix.task == 'test'
        run: apps/herder/scripts/print-test-failures.sh '${{ runner.temp }}/TestResults.xcresult'

      - name: Upload test results
        if: failure() && matrix.task == 'test'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

      # Only main's cache is visible to other refs.
      - name: Save compilation cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/CompilationCache
          key: xcode-cas-${{ matrix.task }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ github.sha }}
