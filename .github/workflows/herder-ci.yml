name: Herder CI

on:
  pull_request:
    paths:
      - apps/herder/**
      - packages/herder-ghostty-vt/**
      - packages/herder-syntax-highlighter/**
      - justfile
      - .github/workflows/herder-ci.yml

concurrency:
  group: herder-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build macOS app
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Install tools
        run: brew install just xcodegen ripgrep

      - name: Show toolchain versions
        run: |
          swift --version
          zig version
          rustup show active-toolchain

      - name: Check import boundaries
        run: just in apps/herder check

      - name: Run tests
        timeout-minutes: 25
        run: just test apps/herder

      - name: Build app
        timeout-minutes: 15
        run: just build apps/herder
