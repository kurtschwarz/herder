[package]
name = "herderd"
version = "0.1.0"
edition = "2024"
publish = false
description = "Herder's daemon: owns agent sessions and terminal processes so they outlive the app."

[lib]
name = "herderd"

[[bin]]
name = "herderd"
path = "src/main.rs"

[dependencies]
gix = { version = "0.91.0", default-features = false, features = ["sha1", "status", "revision", "worktree-mutation"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[profile.release]
opt-level = 3
lto = true
strip = "debuginfo"

# Release without LTO, for builds that only need to run on this machine.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16

[dev-dependencies]
tempfile = "3.27.0"
