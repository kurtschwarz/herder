[package]
name = "herderd"
version = "0.1.0"
edition = "2024"
publish = false
description = "Herder's daemon: owns agent sessions and terminal processes so they outlive the app."

[lib]
name = "herderd"

[[bin]]
name = "herderd"
path = "src/main.rs"

[dependencies]
gix = { version = "0.90.0", default-features = false, features = ["sha1", "status"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = "debuginfo"

[dev-dependencies]
tempfile = "3.27.0"
